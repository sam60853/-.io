<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皇帝牌｜線上對戰</title>
  <style>
    :root {
      --bg: #050f16;
      --bg-2: #0d1d2a;
      --panel: rgba(17, 32, 42, 0.92);
      --panel-strong: rgba(24, 46, 60, 0.98);
      --accent: #e8c883;
      --accent-strong: #f9dc8a;
      --text: #f3efe7;
      --muted: #d7d0bc;
      --good: #7ae5a4;
      --bad: #f39a9a;
      --warning: #f7c76a;
      --card: #2d4050;
      --card-alt: #1a2d3b;
      --border: rgba(232, 200, 131, 0.7);
      --shadow: rgba(0, 0, 0, 0.32);
      --danger: #ff7a7a;
      --success: #7be0a1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at top, rgba(52, 88, 110, 0.35), transparent 45%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }

    #app {
      width: min(980px, 100%);
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px var(--shadow);
      padding: 22px 18px 26px;
    }

    h1 {
      margin: 0 0 18px;
      text-align: center;
      letter-spacing: 0.08em;
      color: var(--accent-strong);
      font-size: clamp(1.8rem, 5vw, 3rem);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    input {
      min-width: 190px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 1rem;
    }

    input::placeholder { color: rgba(255,255,255,0.45); }

    button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      background: linear-gradient(180deg, #234c60, #132e3d);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button:active { transform: translateY(0); }

    button.secondary {
      background: linear-gradient(180deg, #294f62, #213c4d);
    }

    button.danger {
      background: linear-gradient(180deg, #5d2c2c, #402327);
      border-color: rgba(255, 122, 122, 0.6);
    }

    #connStatus {
      font-size: 0.95rem;
      color: var(--muted);
      min-width: 90px;
      text-align: center;
    }

    .panel {
      border: 1px solid rgba(232, 200, 131, 0.4);
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      margin: 12px 0;
      padding: 12px 14px;
    }

    #status {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 700;
      color: var(--muted);
    }

    #score {
      text-align: center;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent-strong);
    }

    #board {
      display: none;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .player {
      background: var(--panel-strong);
      border: 1px solid rgba(232, 200, 131, 0.45);
      border-radius: 14px;
      padding: 14px 12px 12px;
      min-height: 240px;
    }

    .player h2 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 1.12rem;
      color: var(--accent-strong);
    }

    .hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 128px;
    }

    .card {
      position: relative;
      width: 78px;
      height: 116px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card-alt));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      font-weight: 800;
      font-size: 1.02rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.14s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 18px rgba(0,0,0,0.18);
    }

    .card.hidden {
      background: linear-gradient(180deg, #405a6d, #243947);
      color: #edf5ff;
      font-size: 1.6rem;
    }

    .card.selected {
      outline: 3px solid var(--good);
      box-shadow: 0 0 0 4px rgba(122, 229, 164, 0.2);
    }

    .card.used {
      cursor: default;
      opacity: 0.35;
      transform: scale(0.96);
    }

    #controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    #result {
      min-height: 34px;
      margin: 12px 0 8px;
      text-align: center;
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--warning);
    }

    #log {
      min-height: 92px;
      max-height: 210px;
      overflow-y: auto;
      white-space: pre-line;
      background: rgba(0,0,0,0.12);
      border: 1px solid rgba(232,200,131,0.4);
      border-radius: 8px;
      padding: 12px 14px;
      line-height: 1.6;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .legend-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(232, 200, 131, 0.32);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-weight: 700;
    }

    .legend-item .badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 52px;
      height: 52px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card-alt));
    }

    @media (max-width: 760px) {
      #board { grid-template-columns: 1fr; }
      .toolbar { flex-direction: column; align-items: stretch; }
      input, button { width: 100%; }
      .legend { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>皇帝牌</h1>

    <div class="toolbar">
      <button id="btnCreate">建立新房間</button>
      <input id="roomId" type="text" placeholder="輸入房間代碼" />
      <button id="btnJoin" class="secondary">加入房間</button>
      <button id="btnCopy" class="secondary">複製房間碼</button>
      <span id="connStatus">尚未連線</span>
    </div>

    <div id="status" class="panel">狀態：請先建立或加入房間</div>
    <div id="score" class="panel">分數：皇帝 0 - 0 奴隸</div>

    <div id="board">
      <div class="player" id="playerEmperor">
        <h2>我（皇帝方）</h2>
        <div id="handA" class="hand"></div>
      </div>

      <div class="player" id="playerSlave">
        <h2>對手（奴隸方）</h2>
        <div id="handB" class="hand"></div>
      </div>
    </div>

    <div id="controls">
      <button id="btnReset" class="danger">重置遊戲</button>
    </div>

    <div id="result">等待對戰開始</div>

    <div class="panel">
      <div style="font-weight: 800; margin-bottom: 8px; color: var(--accent-strong);">遊戲規則</div>
      <div class="legend">
        <div class="legend-item"><div class="badge">皇帝</div>皇帝 勝 奴隸</div>
        <div class="legend-item"><div class="badge">奴隸</div>奴隸 勝 市民</div>
        <div class="legend-item"><div class="badge">市民</div>市民 勝 皇帝</div>
      </div>
    </div>

    <div id="log" class="panel"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
  <script>
    const CARD_SEQUENCE = ['皇帝', '奴隸', '市民'];
    const CARD_BEATS = {
      皇帝: '奴隸',
      奴隸: '市民',
      市民: '皇帝'
    };

    let role = null;
    let peer = null;
    let conn = null;
    let selectedCardEl = null;
    let myPlayed = null;
    let oppPlayed = null;
    let gameStarted = false;
    let roundResolved = false;
    let score = { emperor: 0, slave: 0 };
    let deckA = [];
    let deckB = [];

    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const boardEl = document.getElementById('board');
    const resultEl = document.getElementById('result');
    const logEl = document.getElementById('log');
    const handAEl = document.getElementById('handA');
    const handBEl = document.getElementById('handB');
    const roomInput = document.getElementById('roomId');
    const connStatusEl = document.getElementById('connStatus');

    const btnCreate = document.getElementById('btnCreate');
    const btnJoin = document.getElementById('btnJoin');
    const btnCopy = document.getElementById('btnCopy');
    const btnReset = document.getElementById('btnReset');

    function logMessage(text) {
      logEl.textContent += `${text}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function updateScore() {
      scoreEl.textContent = `分數：皇帝 ${score.emperor} - ${score.slave} 奴隸`;
    }

    function setStatus(message) {
      statusEl.textContent = `狀態：${message}`;
    }

    function createDeck() {
      return ['皇帝', '奴隸', '市民', '市民'];
    }

    function resetRoundState() {
      myPlayed = null;
      oppPlayed = null;
      selectedCardEl = null;
      roundResolved = false;
      resultEl.textContent = '新回合開始';
      renderHands();
    }

    function resolveWinner(cardA, cardB) {
      if (cardA === cardB) return 'tie';
      return CARD_BEATS[cardA] === cardB ? 'emperor' : 'slave';
    }

    function setRoomStatus(text) {
      connStatusEl.textContent = text;
    }

    function renderHands() {
      handAEl.innerHTML = '';
      handBEl.innerHTML = '';

      const myCards = role === 'emperor' ? deckA : deckB;
      const oppCards = role === 'emperor' ? deckB : deckA;

      myCards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.dataset.card = card;
        cardEl.dataset.index = index;
        cardEl.textContent = card;

        if (role === 'emperor') {
          cardEl.onclick = () => selectLocalCard(cardEl);
        } else {
          cardEl.onclick = () => selectLocalCard(cardEl);
        }

        if (myPlayed && card === myPlayed) {
          cardEl.classList.add('used');
          cardEl.onclick = null;
        }

        if (selectedCardEl && selectedCardEl === cardEl) {
          cardEl.classList.add('selected');
        }

        if (role === 'emperor') {
          handAEl.appendChild(cardEl);
        } else {
          handBEl.appendChild(cardEl);
        }
      });

      oppCards.forEach((card) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card hidden';
        cardEl.textContent = '？';

        if (oppPlayed && card === oppPlayed) {
          cardEl.classList.remove('hidden');
          cardEl.textContent = oppPlayed;
        }

        if (role === 'emperor') {
          handBEl.appendChild(cardEl);
        } else {
          handAEl.appendChild(cardEl);
        }
      });

      if (role === 'emperor') {
        const allA = Array.from(handAEl.children);
        allA.forEach((el) => {
          if (myPlayed && el.dataset.card === myPlayed) el.classList.add('used');
        });
      }

      if (role === 'slave') {
        const allB = Array.from(handBEl.children);
        allB.forEach((el) => {
          if (myPlayed && el.dataset.card === myPlayed) el.classList.add('used');
        });
      }
    }

    function startGame() {
      if (!conn || !conn.open) {
        setStatus('連線尚未建立，請稍後再試');
        return;
      }

      deckA = createDeck();
      deckB = createDeck();
      score = { emperor: 0, slave: 0 };
      gameStarted = true;
      myPlayed = null;
      oppPlayed = null;
      roundResolved = false;
      updateScore();
      boardEl.style.display = 'grid';
      setStatus('對戰開始，請出牌');
      resultEl.textContent = '輪到你出牌';
      logMessage('新遊戲開始');
      renderHands();
    }

    function selectLocalCard(cardEl) {
      if (!gameStarted || !conn || !conn.open || roundResolved) return;

      const card = cardEl.dataset.card;
      const myDeck = role === 'emperor' ? deckA : deckB;

      if (!myDeck.includes(card)) return;
      if (myPlayed !== null) return;

      if (selectedCardEl) selectedCardEl.classList.remove('selected');
      selectedCardEl = cardEl;
      cardEl.classList.add('selected');

      myPlayed = card;
      const idx = myDeck.indexOf(card);
      if (idx !== -1) myDeck.splice(idx, 1);

      const senderName = role === 'emperor' ? '皇帝' : '奴隸';
      conn.send({ type: 'play', player: role, card: myPlayed, sender: senderName });
      logMessage(`${senderName} 方出牌：${myPlayed}`);
      setStatus('已出牌，等待對手');
      renderHands();

      if (oppPlayed) revealRound();
    }

    function revealRound() {
      if (!myPlayed || !oppPlayed || roundResolved) return;

      const roundWinner = resolveWinner(
        role === 'emperor' ? myPlayed : oppPlayed,
        role === 'slave' ? myPlayed : oppPlayed
      );

      const resultMessage = {
        type: 'result',
        emperor: role === 'emperor' ? myPlayed : oppPlayed,
        slave: role === 'slave' ? myPlayed : oppPlayed,
        winner: roundWinner
      };

      showResult(resultMessage);
      roundResolved = true;

      if (deckA.length === 0 || deckB.length === 0) {
        endGame();
      } else {
        setTimeout(() => {
          resetRoundState();
          setStatus('請出牌');
          renderHands();
        }, 1200);
      }
    }

    function showResult(msg) {
      let winnerText = '平手';
      if (msg.winner === 'emperor') {
        winnerText = '皇帝方勝';
        score.emperor += 1;
      } else if (msg.winner === 'slave') {
        winnerText = '奴隸方勝';
        score.slave += 1;
      }

      updateScore();

      if (role === 'emperor') {
        if (msg.winner === 'emperor') {
          resultEl.textContent = '你獲勝！';
        } else if (msg.winner === 'slave') {
          resultEl.textContent = '你落敗！';
        } else {
          resultEl.textContent = '這回合平手';
        }
      } else {
        if (msg.winner === 'slave') {
          resultEl.textContent = '你獲勝！';
        } else if (msg.winner === 'emperor') {
          resultEl.textContent = '你落敗！';
        } else {
          resultEl.textContent = '這回合平手';
        }
      }

      logMessage(`本回合：皇帝 ${msg.emperor} vs 奴隸 ${msg.slave}，結果：${winnerText}`);
    }

    function endGame() {
      if (score.emperor > score.slave) {
        setStatus('遊戲結束，皇帝方獲勝');
      } else if (score.slave > score.emperor) {
        setStatus('遊戲結束，奴隸方獲勝');
      } else {
        setStatus('遊戲結束，雙方平手');
      }
      resultEl.textContent = '遊戲結束';
      logMessage('遊戲結束');
      gameStarted = false;
      roundResolved = true;
    }

    function setupConnection() {
      conn.on('open', () => {
        setRoomStatus('已連線');
        setStatus('連線成功，等待對手確認');
        startGame();
      });

      conn.on('data', (data) => {
        if (data.type === 'play') {
          oppPlayed = data.card;
          logMessage(`${data.player === 'emperor' ? '皇帝' : '奴隸'} 方出牌：${data.card}`);

          if (myPlayed) {
            revealRound();
          } else {
            setStatus('對手已出牌，請出牌');
          }

          renderHands();
        }

        if (data.type === 'result') {
          oppPlayed = data.slave;
          showResult(data);
          roundResolved = true;

          if (deckA.length === 0 || deckB.length === 0) {
            endGame();
          } else {
            setTimeout(() => {
              resetRoundState();
              setStatus('請出牌');
              renderHands();
            }, 1200);
          }
        }
      });

      conn.on('close', () => {
        setRoomStatus('連線中斷');
        setStatus('對手已離線');
        resultEl.textContent = '連線中斷';
      });
    }

    function initPeerConnection() {
      if (peer) {
        peer.destroy();
      }

      peer = new Peer();
      peer.on('open', (id) => {
        roomInput.value = id;
        setRoomStatus(`房間代碼：${id}`);
        setStatus('等待對手加入...');
        role = 'emperor';
        logMessage(`房間建立成功：${id}`);
      });

      peer.on('connection', (connection) => {
        conn = connection;
        role = 'emperor';
        setupConnection();
      });
    }

    btnCreate.onclick = () => {
      initPeerConnection();
    };

    btnJoin.onclick = () => {
      const roomId = roomInput.value.trim();
      if (!roomId) {
        alert('請輸入房間代碼');
        return;
      }

      if (peer) {
        peer.destroy();
      }

      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect(roomId);
        role = 'slave';
        setRoomStatus('連線中...');
        setStatus('嘗試連線到房主...');
        setupConnection();
      });
    };

    btnCopy.onclick = async () => {
      const code = roomInput.value.trim();
      if (!code) {
        alert('目前沒有房間代碼可複製');
        return;
      }

      try {
        await navigator.clipboard.writeText(code);
        setRoomStatus('已複製');
        logMessage(`已複製房間碼：${code}`);
      } catch (error) {
        setRoomStatus('複製失敗');
        logMessage('複製房間碼失敗，請手動複製');
      }
    };

    btnReset.onclick = () => {
      if (conn && conn.open) {
        startGame();
      } else {
        setStatus('請先建立或加入房間後再重置');
      }
    };

    logMessage('開始使用皇帝牌。先建立房間或輸入房間代碼加入對戰。');
  </script>
</body>
</html>
