<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皇帝牌｜線上對戰與單人挑戰</title>
  <style>
    :root {
      --bg: #07141c;
      --bg-2: #122935;
      --panel: rgba(16, 35, 46, 0.96);
      --panel-2: rgba(23, 49, 63, 0.96);
      --accent: #e5c97d;
      --accent-strong: #f8df9a;
      --text: #f5efe5;
      --muted: #d7c9a7;
      --good: #7fe2a1;
      --bad: #f29d9d;
      --warning: #f6c76b;
      --card: #304b5a;
      --card-alt: #1c2e3d;
      --border: rgba(229, 201, 125, 0.72);
      --shadow: rgba(0, 0, 0, 0.28);
      --blue: #49a7d9;
      --purple: #b589e3;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at top, rgba(71, 100, 124, 0.30), transparent 40%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }

    #app {
      width: min(1000px, 100%);
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 22px 52px var(--shadow);
      padding: 22px 18px 24px;
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      letter-spacing: 0.08em;
      color: var(--accent-strong);
      font-size: clamp(1.9rem, 4vw, 3rem);
    }

    .mode-box {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .mode-btn {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #264d62, #183549);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .mode-btn.active {
      background: linear-gradient(180deg, #2e5d75, #1f445a);
      box-shadow: 0 0 0 2px rgba(248, 223, 154, 0.18);
    }

    .mode-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    input {
      min-width: 220px;
      padding: 11px 14px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 1rem;
    }

    input::placeholder { color: rgba(255,255,255,0.46); }

    button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
      background: linear-gradient(180deg, #21465a, #142f3d);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button.secondary {
      background: linear-gradient(180deg, #2a536a, #1c3d4e);
    }

    button.danger {
      background: linear-gradient(180deg, #672f2f, #42242a);
      border-color: rgba(242, 157, 157, 0.6);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    #connStatus {
      min-width: 110px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .panel {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(229,201,125,0.38);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 12px 0;
    }

    #status {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      font-weight: 800;
    }

    #score {
      text-align: center;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-strong);
    }

    #board {
      display: none;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .player {
      background: var(--panel-2);
      border: 1px solid rgba(229,201,125,0.42);
      border-radius: 14px;
      padding: 14px 12px 12px;
      min-height: 240px;
    }

    .player h2 {
      margin: 0 0 14px;
      text-align: center;
      color: var(--accent-strong);
      font-size: 1.12rem;
    }

    .hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 128px;
    }

    .card {
      position: relative;
      width: 78px;
      height: 116px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card-alt));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.14s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(0,0,0,0.18);
    }

    .card.hidden {
      background: linear-gradient(180deg, #415d6f, #233647);
      color: #eff4fb;
      font-size: 1.7rem;
    }

    .card.selected {
      outline: 3px solid var(--good);
      box-shadow: 0 0 0 4px rgba(127, 226, 161, 0.18);
    }

    .card.used {
      opacity: 0.35;
      transform: scale(0.96);
      cursor: default;
    }

    .solo-controls {
      display: none;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 12px;
    }

    #controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    #result {
      min-height: 34px;
      margin: 12px 0 8px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--warning);
    }

    #log {
      min-height: 100px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-line;
      background: rgba(0,0,0,0.12);
      border: 1px solid rgba(229,201,125,0.4);
      border-radius: 8px;
      padding: 12px 14px;
      line-height: 1.6;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .rules {
      display: grid;
      grid-template-columns: repeat(3, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .rule {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(229,201,125,0.3);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-weight: 700;
      color: var(--text);
    }

    .rule .badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 52px;
      height: 52px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card-alt));
      font-size: 0.9rem;
    }

    @media (max-width: 760px) {
      #board { grid-template-columns: 1fr; }
      .toolbar, .solo-controls { flex-direction: column; align-items: stretch; }
      input, button { width: 100%; }
      .rules { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>皇帝牌</h1>

    <div class="mode-box">
      <button id="modeMulti" class="mode-btn active">多人模式</button>
      <button id="modeSolo" class="mode-btn">單人模式（VS 電腦）</button>
    </div>

    <div class="toolbar" id="multiToolbar">
      <button id="btnCreate">建立新房間</button>
      <input id="roomId" type="text" placeholder="輸入房間代碼" />
      <button id="btnJoin" class="secondary">加入房間</button>
      <button id="btnCopy" class="secondary">複製房間碼</button>
      <span id="connStatus">尚未連線</span>
    </div>

    <div class="solo-controls" id="soloControls">
      <button id="btnSoloEmperor">我當皇帝</button>
      <button id="btnSoloSlave" class="secondary">我當奴隸</button>
      <button id="btnSoloStart" class="secondary">開始單人對戰</button>
    </div>

    <div id="status" class="panel">狀態：請選擇模式並開始遊戲</div>
    <div id="score" class="panel">分數：皇帝 0 - 0 奴隸</div>

    <div id="board">
      <div class="player">
        <h2 id="labelA">我方</h2>
        <div id="handA" class="hand"></div>
      </div>

      <div class="player">
        <h2 id="labelB">對手</h2>
        <div id="handB" class="hand"></div>
      </div>
    </div>

    <div id="controls">
      <button id="btnReset" class="danger">重置遊戲</button>
    </div>

    <div id="result">等待對戰開始</div>

    <div class="panel">
      <div style="font-weight: 800; margin-bottom: 8px; color: var(--accent-strong);">遊戲規則</div>
      <div class="rules">
        <div class="rule"><div class="badge">皇帝</div>皇帝 勝 奴隸</div>
        <div class="rule"><div class="badge">奴隸</div>奴隸 勝 市民</div>
        <div class="rule"><div class="badge">市民</div>市民 勝 皇帝</div>
      </div>
    </div>

    <div id="log" class="panel"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
  <script>
    const CARD_BEATS = {
      皇帝: '奴隸',
      奴隸: '市民',
      市民: '皇帝'
    };

    const state = {
      mode: 'multi',
      role: null,
      humanRole: null,
      peer: null,
      conn: null,
      gameStarted: false,
      roundResolved: false,
      selectedCardEl: null,
      myPlayed: null,
      oppPlayed: null,
      score: { emperor: 0, slave: 0 },
      deckA: [],
      deckB: [],
      pendingTimer: null,
      turn: 'human'
    };

    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const boardEl = document.getElementById('board');
    const resultEl = document.getElementById('result');
    const logEl = document.getElementById('log');
    const handAEl = document.getElementById('handA');
    const handBEl = document.getElementById('handB');
    const roomInput = document.getElementById('roomId');
    const connStatusEl = document.getElementById('connStatus');
    const labelAEl = document.getElementById('labelA');
    const labelBEl = document.getElementById('labelB');

    const btnCreate = document.getElementById('btnCreate');
    const btnJoin = document.getElementById('btnJoin');
    const btnCopy = document.getElementById('btnCopy');
    const btnReset = document.getElementById('btnReset');
    const btnModeMulti = document.getElementById('modeMulti');
    const btnModeSolo = document.getElementById('modeSolo');
    const soloControls = document.getElementById('soloControls');
    const multiToolbar = document.getElementById('multiToolbar');
    const btnSoloEmperor = document.getElementById('btnSoloEmperor');
    const btnSoloSlave = document.getElementById('btnSoloSlave');
    const btnSoloStart = document.getElementById('btnSoloStart');

    function logMessage(text) {
      logEl.textContent += `${text}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(message) {
      statusEl.textContent = `狀態：${message}`;
    }

    function setConnStatus(text) {
      connStatusEl.textContent = text;
    }

    function updateScore() {
      scoreEl.textContent = `分數：皇帝 ${state.score.emperor} - ${state.score.slave} 奴隸`;
    }

    function createDeck() {
      return ['皇帝', '奴隸', '市民', '市民'];
    }

    function resolveWinner(cardA, cardB) {
      if (cardA === cardB) return 'tie';
      return CARD_BEATS[cardA] === cardB ? 'emperor' : 'slave';
    }

    function resetRoundState() {
      state.myPlayed = null;
      state.oppPlayed = null;
      state.selectedCardEl = null;
      state.roundResolved = false;
      resultEl.textContent = '新回合開始';
      renderHands();
    }

    function setRoleLabels() {
      if (state.mode === 'solo') {
        if (state.role === 'emperor') {
          labelAEl.textContent = '我（皇帝方）';
          labelBEl.textContent = '電腦（奴隸方）';
        } else {
          labelAEl.textContent = '電腦（皇帝方）';
          labelBEl.textContent = '我（奴隸方）';
        }
      } else {
        if (state.role === 'emperor') {
          labelAEl.textContent = '我（皇帝方）';
          labelBEl.textContent = '對手（奴隸方）';
        } else {
          labelAEl.textContent = '對手（皇帝方）';
          labelBEl.textContent = '我（奴隸方）';
        }
      }
    }

    function renderHands() {
      handAEl.innerHTML = '';
      handBEl.innerHTML = '';

      const deckHuman = state.role === 'emperor' ? state.deckA : state.deckB;
      const deckEnemy = state.role === 'emperor' ? state.deckB : state.deckA;

      const humanCards = deckHuman || [];
      const enemyCards = deckEnemy || [];

      if (state.mode === 'solo') {
        if (state.role === 'emperor') {
          humanCards.forEach((card) => {
            const el = document.createElement('div');
            el.className = 'card';
            el.dataset.card = card;
            el.textContent = card;
            if (state.myPlayed && card === state.myPlayed) {
              el.classList.add('used');
              el.onclick = null;
            } else {
              el.onclick = () => selectLocalCard(el);
            }
            if (state.selectedCardEl === el) el.classList.add('selected');
            handAEl.appendChild(el);
          });

          enemyCards.forEach((card) => {
            const el = document.createElement('div');
            el.className = 'card hidden';
            if (state.oppPlayed && card === state.oppPlayed) {
              el.classList.remove('hidden');
              el.textContent = card;
            } else {
              el.textContent = '？';
            }
            handBEl.appendChild(el);
          });
        } else {
          humanCards.forEach((card) => {
            const el = document.createElement('div');
            el.className = 'card';
            el.dataset.card = card;
            el.textContent = card;
            if (state.myPlayed && card === state.myPlayed) {
              el.classList.add('used');
              el.onclick = null;
            } else {
              el.onclick = () => selectLocalCard(el);
            }
            if (state.selectedCardEl === el) el.classList.add('selected');
            handBEl.appendChild(el);
          });

          enemyCards.forEach((card) => {
            const el = document.createElement('div');
            el.className = 'card hidden';
            if (state.oppPlayed && card === state.oppPlayed) {
              el.classList.remove('hidden');
              el.textContent = card;
            } else {
              el.textContent = '？';
            }
            handAEl.appendChild(el);
          });
        }
        return;
      }

      if (state.role === 'emperor') {
        humanCards.forEach((card) => {
          const el = document.createElement('div');
          el.className = 'card';
          el.dataset.card = card;
          el.textContent = card;
          if (state.myPlayed && card === state.myPlayed) {
            el.classList.add('used');
            el.onclick = null;
          } else {
            el.onclick = () => selectLocalCard(el);
          }
          if (state.selectedCardEl === el) el.classList.add('selected');
          handAEl.appendChild(el);
        });

        enemyCards.forEach((card) => {
          const el = document.createElement('div');
          el.className = 'card hidden';
          if (state.oppPlayed && card === state.oppPlayed) {
            el.classList.remove('hidden');
            el.textContent = card;
          } else {
            el.textContent = '？';
          }
          handBEl.appendChild(el);
        });
      } else {
        humanCards.forEach((card) => {
          const el = document.createElement('div');
          el.className = 'card';
          el.dataset.card = card;
          el.textContent = card;
          if (state.myPlayed && card === state.myPlayed) {
            el.classList.add('used');
            el.onclick = null;
          } else {
            el.onclick = () => selectLocalCard(el);
          }
          if (state.selectedCardEl === el) el.classList.add('selected');
          handBEl.appendChild(el);
        });

        enemyCards.forEach((card) => {
          const el = document.createElement('div');
          el.className = 'card hidden';
          if (state.oppPlayed && card === state.oppPlayed) {
            el.classList.remove('hidden');
            el.textContent = card;
          } else {
            el.textContent = '？';
          }
          handAEl.appendChild(el);
        });
      }
    }

    function startNewMatch() {
      state.deckA = createDeck();
      state.deckB = createDeck();
      state.score = { emperor: 0, slave: 0 };
      state.gameStarted = true;
      state.myPlayed = null;
      state.oppPlayed = null;
      state.roundResolved = false;
      state.turn = 'human';
      boardEl.style.display = 'grid';
      updateScore();
      setRoleLabels();
      resultEl.textContent = '輪到你出牌';
      setStatus('對戰開始，請出牌');
      logMessage('新遊戲開始');
      renderHands();
    }

    function chooseAiCard() {
      const aiDeck = state.role === 'emperor' ? state.deckB : state.deckA;
      if (!aiDeck || aiDeck.length === 0) return null;

      const prefer = ['皇帝', '奴隸', '市民'];
      let pick = null;
      for (const card of prefer) {
        if (aiDeck.includes(card)) {
          pick = card;
          break;
        }
      }
      return pick || aiDeck[Math.floor(Math.random() * aiDeck.length)];
    }

    function finishSoloRound() {
      if (!state.myPlayed || !state.oppPlayed || state.roundResolved) return;

      const emperorCard = state.role === 'emperor' ? state.myPlayed : state.oppPlayed;
      const slaveCard = state.role === 'slave' ? state.myPlayed : state.oppPlayed;
      const winner = resolveWinner(emperorCard, slaveCard);

      const msg = { winner, emperor: emperorCard, slave: slaveCard };
      showResult(msg);
      state.roundResolved = true;

      if (state.deckA.length === 0 || state.deckB.length === 0) {
        endGame();
        return;
      }

      setTimeout(() => {
        resetRoundState();
        state.turn = 'human';
        setStatus('請出牌');
        resultEl.textContent = '輪到你出牌';
        renderHands();
      }, 1200);
    }

    function playAiTurn() {
      if (!state.gameStarted || state.mode !== 'solo') return;
      const aiCard = chooseAiCard();
      if (!aiCard) return;

      state.oppPlayed = aiCard;
      const aiDeck = state.role === 'emperor' ? state.deckB : state.deckA;
      const idx = aiDeck.indexOf(aiCard);
      if (idx !== -1) aiDeck.splice(idx, 1);

      logMessage(`電腦出牌：${aiCard}`);
      setStatus('電腦已出牌，請出牌');
      renderHands();

      if (state.myPlayed) {
        finishSoloRound();
      }
    }

    function selectLocalCard(cardEl) {
      if (!state.gameStarted) return;
      if (state.mode === 'solo' && state.turn !== 'human') return;
      if (state.mode === 'multi' && (!state.conn || !state.conn.open || state.roundResolved)) return;
      if (state.mode === 'multi' && state.myPlayed) return;
      if (state.mode === 'solo' && state.myPlayed) return;

      const card = cardEl.dataset.card;
      const myDeck = state.role === 'emperor' ? state.deckA : state.deckB;
      if (!myDeck.includes(card)) return;

      if (state.selectedCardEl) state.selectedCardEl.classList.remove('selected');
      state.selectedCardEl = cardEl;
      cardEl.classList.add('selected');

      state.myPlayed = card;
      const idx = myDeck.indexOf(card);
      if (idx !== -1) myDeck.splice(idx, 1);

      if (state.mode === 'multi') {
        const senderRole = state.role === 'emperor' ? '皇帝' : '奴隸';
        state.conn.send({ type: 'play', player: state.role, card: state.myPlayed, sender: senderRole });
        setStatus('已出牌，等待對手');
        logMessage(`${senderRole} 方出牌：${state.myPlayed}`);
        renderHands();
        if (state.oppPlayed) revealMultiRound();
        return;
      }

      const humanLabel = state.role === 'emperor' ? '皇帝' : '奴隸';
      logMessage(`${humanLabel} 方出牌：${state.myPlayed}`);
      setStatus('已出牌，等待電腦回應');
      state.turn = 'ai';
      renderHands();

      setTimeout(() => {
        playAiTurn();
      }, 600);
    }

    function revealMultiRound() {
      if (!state.myPlayed || !state.oppPlayed || state.roundResolved) return;

      const emperorCard = state.role === 'emperor' ? state.myPlayed : state.oppPlayed;
      const slaveCard = state.role === 'slave' ? state.myPlayed : state.oppPlayed;
      const winner = resolveWinner(emperorCard, slaveCard);
      const msg = { type: 'result', emperor: emperorCard, slave: slaveCard, winner };

      if (state.role === 'emperor') {
        state.conn.send(msg);
      }

      showResult(msg);
      state.roundResolved = true;

      if (state.deckA.length === 0 || state.deckB.length === 0) {
        endGame();
        return;
      }

      setTimeout(() => {
        resetRoundState();
        setStatus('請出牌');
        resultEl.textContent = '輪到你出牌';
        renderHands();
      }, 1200);
    }

    function showResult(msg) {
      let winnerText = '平手';
      if (msg.winner === 'emperor') {
        winnerText = '皇帝方勝';
        state.score.emperor += 1;
      } else if (msg.winner === 'slave') {
        winnerText = '奴隸方勝';
        state.score.slave += 1;
      }
      updateScore();

      if (state.mode === 'solo') {
        if (state.role === 'emperor') {
          if (msg.winner === 'emperor') resultEl.textContent = '你獲勝！';
          else if (msg.winner === 'slave') resultEl.textContent = '你落敗！';
          else resultEl.textContent = '這回合平手';
        } else {
          if (msg.winner === 'slave') resultEl.textContent = '你獲勝！';
          else if (msg.winner === 'emperor') resultEl.textContent = '你落敗！';
          else resultEl.textContent = '這回合平手';
        }
      } else {
        if (state.role === 'emperor') {
          if (msg.winner === 'emperor') resultEl.textContent = '你獲勝！';
          else if (msg.winner === 'slave') resultEl.textContent = '你落敗！';
          else resultEl.textContent = '這回合平手';
        } else {
          if (msg.winner === 'slave') resultEl.textContent = '你獲勝！';
          else if (msg.winner === 'emperor') resultEl.textContent = '你落敗！';
          else resultEl.textContent = '這回合平手';
        }
      }

      logMessage(`本回合：皇帝 ${msg.emperor} vs 奴隸 ${msg.slave}，結果：${winnerText}`);
    }

    function endGame() {
      if (state.score.emperor > state.score.slave) {
        setStatus('遊戲結束，皇帝方獲勝');
      } else if (state.score.slave > state.score.emperor) {
        setStatus('遊戲結束，奴隸方獲勝');
      } else {
        setStatus('遊戲結束，雙方平手');
      }
      resultEl.textContent = '遊戲結束';
      logMessage('遊戲結束');
      state.gameStarted = false;
      state.roundResolved = true;
    }

    function setupPeerConnection() {
      state.conn.on('open', () => {
        setConnStatus('已連線');
        setStatus('連線成功，等待雙方確認');
        startNewMatch();
      });

      state.conn.on('data', (data) => {
        if (data.type === 'play') {
          state.oppPlayed = data.card;
          logMessage(`${data.player === 'emperor' ? '皇帝' : '奴隸'} 方出牌：${data.card}`);

          if (state.myPlayed) {
            revealMultiRound();
          } else {
            setStatus('對手已出牌，請出牌');
          }

          renderHands();
        }

        if (data.type === 'result') {
          state.oppPlayed = data.slave;
          showResult(data);
          state.roundResolved = true;

          if (state.deckA.length === 0 || state.deckB.length === 0) {
            endGame();
          } else {
            setTimeout(() => {
              resetRoundState();
              setStatus('請出牌');
              renderHands();
            }, 1200);
          }
        }
      });

      state.conn.on('close', () => {
        setConnStatus('連線中斷');
        setStatus('對手已離線');
        resultEl.textContent = '連線中斷';
      });
    }

    function handleSelectMode(mode) {
      state.mode = mode;
      btnModeMulti.classList.toggle('active', mode === 'multi');
      btnModeSolo.classList.toggle('active', mode === 'solo');
      multiToolbar.style.display = mode === 'multi' ? 'flex' : 'none';
      soloControls.style.display = mode === 'solo' ? 'flex' : 'none';

      if (state.peer) {
        state.peer.destroy();
        state.peer = null;
      }
      state.conn = null;
      state.role = null;
      state.gameStarted = false;
      state.myPlayed = null;
      state.oppPlayed = null;
      state.roundResolved = false;
      state.selectedCardEl = null;
      state.turn = 'human';
      clearTimeout(state.pendingTimer);
      state.pendingTimer = null;
      boardEl.style.display = 'none';
      setConnStatus('尚未連線');
      setStatus(mode === 'multi' ? '狀態：請建立或加入房間' : '狀態：請選擇你要當皇帝或奴隸');
      resultEl.textContent = mode === 'multi' ? '等待對戰開始' : '等待單人對戰開始';
      logMessage(mode === 'multi' ? '已切換到多人模式' : '已切換到單人模式');
      updateScore();
      handAEl.innerHTML = '';
      handBEl.innerHTML = '';
      labelAEl.textContent = '我方';
      labelBEl.textContent = '對手';
    }

    function startSoloGame(roleChoice) {
      state.role = roleChoice;
      state.mode = 'solo';
      state.conn = null;
      boardEl.style.display = 'grid';
      setConnStatus('單人模式');
      setRoleLabels();
      startNewMatch();
      if (roleChoice === 'slave') {
        setStatus('你先後手，電腦先出牌');
        state.turn = 'ai';
        resultEl.textContent = '電腦先攻';
        renderHands();
        setTimeout(() => {
          playAiTurn();
        }, 600);
      }
    }

    btnModeMulti.onclick = () => handleSelectMode('multi');
    btnModeSolo.onclick = () => handleSelectMode('solo');

    btnSoloEmperor.onclick = () => {
      state.humanRole = 'emperor';
      btnSoloEmperor.style.borderColor = 'rgba(248,223,154,0.8)';
      btnSoloSlave.style.borderColor = 'rgba(229,201,125,0.72)';
      state.role = 'emperor';
    };

    btnSoloSlave.onclick = () => {
      state.humanRole = 'slave';
      btnSoloSlave.style.borderColor = 'rgba(248,223,154,0.8)';
      btnSoloEmperor.style.borderColor = 'rgba(229,201,125,0.72)';
      state.role = 'slave';
    };

    btnSoloStart.onclick = () => {
      const chosen = state.humanRole || 'emperor';
      startSoloGame(chosen);
    };

    btnCreate.onclick = () => {
      if (state.peer) state.peer.destroy();
      state.peer = new Peer();
      state.mode = 'multi';
      state.role = 'emperor';
      setRoleLabels();

      state.peer.on('open', (id) => {
        roomInput.value = id;
        setConnStatus(`房間代碼：${id}`);
        setStatus('等待對手加入...');
        logMessage(`房間建立成功：${id}`);
      });

      state.peer.on('connection', (connection) => {
        state.conn = connection;
        state.role = 'emperor';
        setRoleLabels();
        setupPeerConnection();
      });
    };

    btnJoin.onclick = () => {
      const roomId = roomInput.value.trim();
      if (!roomId) {
        alert('請輸入房間代碼');
        return;
      }

      if (state.peer) state.peer.destroy();
      state.peer = new Peer();
      state.mode = 'multi';
      state.role = 'slave';
      setRoleLabels();

      state.peer.on('open', () => {
        state.conn = state.peer.connect(roomId);
        setConnStatus('連線中...');
        setStatus('嘗試連線到房主...');
        setupPeerConnection();
      });
    };

    btnCopy.onclick = async () => {
      const code = roomInput.value.trim();
      if (!code) {
        alert('目前沒有房間代碼可複製');
        return;
      }
      try {
        await navigator.clipboard.writeText(code);
        setConnStatus('已複製');
        logMessage(`已複製房間碼：${code}`);
      } catch (error) {
        setConnStatus('複製失敗');
        logMessage('複製房間碼失敗，請手動複製');
      }
    };

    btnReset.onclick = () => {
      if (state.mode === 'multi') {
        if (state.conn && state.conn.open) {
          startNewMatch();
        } else {
          setStatus('請先建立或加入房間後再重置');
        }
      } else {
        const chosen = state.humanRole || 'emperor';
        startSoloGame(chosen);
      }
    };

    handleSelectMode('multi');
    logMessage('皇帝牌已準備就緒：可選擇多人模式或單人模式。');
  </script>
</body>
</html>
