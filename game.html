<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皇帝牌｜線上對戰與單人挑戰</title>
  <style>
    :root {
      --bg: #07141c;
      --panel: rgba(16, 35, 46, 0.96);
      --panel-2: rgba(23, 49, 63, 0.96);
      --border: rgba(229, 201, 125, 0.72);
      --gold: #e5c97d;
      --gold-strong: #f8df9a;
      --text: #f5efe5;
      --muted: #d7c9a7;
      --good: #7fe2a1;
      --bad: #f29d9d;
      --warning: #f6c76b;
      --card: #304b5a;
      --card-alt: #1c2e3d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at top, rgba(71, 100, 124, 0.32), transparent 40%),
        linear-gradient(180deg, #07141c 0%, #122935 100%);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }

    .app {
      width: min(980px, 100%);
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 22px 52px rgba(0, 0, 0, 0.28);
      padding: 20px 16px 18px;
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      letter-spacing: 0.08em;
      color: var(--gold-strong);
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .mode-box {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .mode-btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(180deg, #264d62, #183549);
      color: var(--text);
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .mode-btn.active {
      background: linear-gradient(180deg, #2e5d75, #1f445a);
      box-shadow: 0 0 0 2px rgba(248, 223, 154, 0.18);
    }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input {
      min-width: 220px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    input::placeholder { color: rgba(255,255,255,0.46); }

    button {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(180deg, #21465a, #142f3d);
      color: var(--text);
      padding: 10px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button.selected {
      border-color: rgba(248, 223, 154, 0.8);
      box-shadow: 0 0 0 2px rgba(248, 223, 154, 0.18);
    }

    button.danger {
      background: linear-gradient(180deg, #672f2f, #42242a);
      border-color: rgba(242, 157, 157, 0.6);
    }

    .panel {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(229, 201, 125, 0.38);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 12px 0;
    }

    #status, #score, #connStatus {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      color: var(--muted);
    }

    #score {
      color: var(--gold-strong);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .player-box {
      background: var(--panel-2);
      border: 1px solid rgba(229, 201, 125, 0.42);
      border-radius: 14px;
      padding: 14px 12px 12px;
      min-height: 240px;
    }

    .player-box h2 {
      margin: 0 0 14px;
      text-align: center;
      color: var(--gold-strong);
      font-size: 1.12rem;
    }

    .hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 130px;
    }

    .card {
      width: 82px;
      height: 118px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card-alt));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      user-select: none;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      padding: 8px;
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(0,0,0,0.18);
    }

    .card.hidden {
      background: linear-gradient(180deg, #415d6f, #233647);
      color: #eff4fb;
      font-size: 1.7rem;
      cursor: default;
    }

    .card.selected {
      outline: 3px solid var(--good);
      box-shadow: 0 0 0 4px rgba(127, 226, 161, 0.18);
    }

    .card.disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    #result {
      min-height: 34px;
      text-align: center;
      margin: 12px 0 8px;
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--warning);
    }

    #log {
      min-height: 120px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-line;
      background: rgba(0,0,0,0.12);
      border: 1px solid rgba(229,201,125,0.4);
      border-radius: 8px;
      padding: 12px 14px;
      line-height: 1.7;
      color: var(--muted);
    }

    .rules {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .rule {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(229,201,125,0.3);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-weight: 700;
    }

    .rule .badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 54px;
      height: 54px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card-alt));
      font-size: 0.9rem;
    }

    .hidden-multi,
    .hidden-solo {
      display: none;
    }

    @media (max-width: 760px) {
      #board { grid-template-columns: 1fr; }
      .toolbar, .mode-box { flex-direction: column; }
      button, input { width: 100%; }
      .rules { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>皇帝牌</h1>

    <div class="mode-box">
      <button id="modeSolo" class="mode-btn active" type="button">單人模式</button>
      <button id="modeMulti" class="mode-btn" type="button">多人模式</button>
    </div>

    <div id="soloBar" class="toolbar">
      <button id="btnRoleEmperor" class="selected" type="button">我當皇帝</button>
      <button id="btnRoleSlave" type="button">我當奴隸</button>
      <button id="btnStartSolo" type="button">開始單人遊戲</button>
    </div>

    <div id="multiBar" class="toolbar hidden-multi">
      <button id="btnCreateRoom" type="button">建立房間</button>
      <input id="roomInput" type="text" placeholder="輸入 5 位數房間碼" maxlength="5" inputmode="numeric" />
      <button id="btnJoinRoom" type="button">加入房間</button>
      <button id="btnCopyRoom" type="button">複製碼</button>
      <span id="connStatus">尚未連線</span>
    </div>

    <div id="status" class="panel">選擇角色後開始遊戲</div>
    <div id="score" class="panel">分數：皇帝 0 - 0 奴隸</div>

    <div id="board">
      <div class="player-box">
        <h2 id="labelPlayer">我方</h2>
        <div id="handPlayer" class="hand"></div>
      </div>

      <div class="player-box">
        <h2 id="labelEnemy">對手</h2>
        <div id="handEnemy" class="hand"></div>
      </div>
    </div>

    <div id="result">等待開始</div>

    <div class="panel">
      <div style="font-weight:800; margin-bottom:8px; color:var(--gold-strong);">遊戲規則</div>
      <div class="rules">
        <div class="rule"><div class="badge">皇帝</div>皇帝 勝 奴隸</div>
        <div class="rule"><div class="badge">奴隸</div>奴隸 勝 市民</div>
        <div class="rule"><div class="badge">市民</div>市民 勝 皇帝</div>
      </div>
    </div>

    <div id="log" class="panel"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
  <script>
    const CARD_BEATS = {
      皇帝: '奴隸',
      奴隸: '市民',
      市民: '皇帝'
    };

    const state = {
      mode: 'solo',
      playerRole: 'emperor',
      myDeck: [],
      enemyDeck: [],
      mySelected: null,
      enemySelected: null,
      gameStarted: false,
      roundLock: false,
      score: { emperor: 0, slave: 0 },
      peer: null,
      conn: null,
      isHost: false,
      roomId: ''
    };

    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const resultEl = document.getElementById('result');
    const logEl = document.getElementById('log');
    const handPlayer = document.getElementById('handPlayer');
    const handEnemy = document.getElementById('handEnemy');
    const labelPlayer = document.getElementById('labelPlayer');
    const labelEnemy = document.getElementById('labelEnemy');
    const roomInput = document.getElementById('roomInput');
    const connStatusEl = document.getElementById('connStatus');

    function logMessage(text) {
      logEl.textContent += `${text}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(message) {
      statusEl.textContent = `狀態：${message}`;
    }

    function setConnStatus(text) {
      connStatusEl.textContent = text;
    }

    function sanitizeRoomCode(value) {
      return String(value || '').replace(/\D/g, '').slice(0, 5);
    }

    function generateRoomCode() {
      return String(Math.floor(10000 + Math.random() * 90000));
    }

    function updateScore() {
      scoreEl.textContent = `分數：皇帝 ${state.score.emperor} - ${state.score.slave} 奴隸`;
    }

    function shuffleDeck(deck) {
      const next = [...deck];
      for (let i = next.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [next[i], next[j]] = [next[j], next[i]];
      }
      return next;
    }

    function createDeck() {
      return shuffleDeck(['皇帝', '奴隸', '市民', '市民']);
    }

    function removeCard(deck, card) {
      const index = deck.indexOf(card);
      if (index >= 0) deck.splice(index, 1);
      return deck;
    }

    function updateRoleLabel() {
      if (state.mode === 'solo') {
        if (state.playerRole === 'emperor') {
          labelPlayer.textContent = '我（皇帝方）';
          labelEnemy.textContent = '電腦（奴隸方）';
        } else {
          labelPlayer.textContent = '我（奴隸方）';
          labelEnemy.textContent = '電腦（皇帝方）';
        }
        return;
      }

      if (state.playerRole === 'emperor') {
        labelPlayer.textContent = '我（皇帝方）';
        labelEnemy.textContent = '對手（奴隸方）';
      } else {
        labelPlayer.textContent = '我（奴隸方）';
        labelEnemy.textContent = '對手（皇帝方）';
      }
    }

    function getMyDeck() {
      return state.playerRole === 'emperor' ? state.myDeck : state.enemyDeck;
    }

    function getEnemyDeck() {
      return state.playerRole === 'emperor' ? state.enemyDeck : state.myDeck;
    }

    function battleWinner(emperorCard, slaveCard) {
      if (emperorCard === slaveCard) return 'tie';
      return CARD_BEATS[emperorCard] === slaveCard ? 'emperor' : 'slave';
    }

    function renderHands() {
      handPlayer.innerHTML = '';
      handEnemy.innerHTML = '';

      const myDeck = getMyDeck();
      const enemyDeck = getEnemyDeck();
      const shouldRevealEnemyCard = Boolean(state.enemySelected && state.mySelected);

      myDeck.forEach((card) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.textContent = card;
        el.dataset.card = card;
        if (state.mySelected === card) {
          el.classList.add('selected');
        }
        if (!state.gameStarted || state.roundLock || state.mySelected) {
          el.classList.add('disabled');
          el.onclick = null;
        } else {
          el.onclick = () => selectLocalCard(card, el);
        }
        handPlayer.appendChild(el);
      });

      enemyDeck.forEach((card) => {
        const el = document.createElement('div');
        el.className = 'card hidden';
        if (shouldRevealEnemyCard && card === state.enemySelected) {
          el.classList.remove('hidden');
          el.textContent = card;
        } else {
          el.textContent = '?';
        }
        handEnemy.appendChild(el);
      });
    }

    function startSoloGame() {
      state.mode = 'solo';
      state.playerRole = document.getElementById('btnRoleEmperor').classList.contains('selected') ? 'emperor' : 'slave';
      state.myDeck = createDeck();
      state.enemyDeck = createDeck();
      state.mySelected = null;
      state.enemySelected = null;
      state.gameStarted = true;
      state.roundLock = false;
      state.score = { emperor: 0, slave: 0 };
      updateRoleLabel();
      updateScore();
      setStatus('遊戲開始，請出牌');
      resultEl.textContent = '輪到你出牌';
      logMessage('單人模式開始');
      renderHands();
    }

    function chooseAiCard() {
      const deck = getEnemyDeck();
      if (!deck.length) return null;
      const order = ['皇帝', '奴隸', '市民'];
      for (const card of order) if (deck.includes(card)) return card;
      return deck[Math.floor(Math.random() * deck.length)];
    }

    function resolveSoloRound() {
      if (!state.mySelected || !state.enemySelected) return;

      const myCard = state.mySelected;
      const enemyCard = state.enemySelected;
      const emperorCard = state.playerRole === 'emperor' ? myCard : enemyCard;
      const slaveCard = state.playerRole === 'emperor' ? enemyCard : myCard;
      const result = battleWinner(emperorCard, slaveCard);

      if (result === 'emperor') state.score.emperor += 1;
      else if (result === 'slave') state.score.slave += 1;
      updateScore();

      removeCard(state.myDeck, myCard);
      removeCard(state.enemyDeck, enemyCard);

      if (state.playerRole === 'emperor') {
        if (result === 'emperor') resultEl.textContent = '你獲勝！';
        else if (result === 'slave') resultEl.textContent = '你落敗！';
        else resultEl.textContent = '這回合平手';
      } else {
        if (result === 'slave') resultEl.textContent = '你獲勝！';
        else if (result === 'emperor') resultEl.textContent = '你落敗！';
        else resultEl.textContent = '這回合平手';
      }

      logMessage(`本回合：你出 ${myCard}，電腦出 ${enemyCard}，結果：${result === 'tie' ? '平手' : result === 'emperor' ? '皇帝方勝' : '奴隸方勝'}`);
      renderHands();

      if (state.myDeck.length === 0 || state.enemyDeck.length === 0) {
        setTimeout(endGame, 600);
        return;
      }

      setTimeout(() => {
        state.mySelected = null;
        state.enemySelected = null;
        state.roundLock = false;
        setStatus('請出牌');
        resultEl.textContent = '輪到你出牌';
        renderHands();
      }, 900);
    }

    function selectLocalCard(card, el) {
      if (!state.gameStarted || state.roundLock || state.mySelected) return;

      state.mySelected = card;
      state.roundLock = true;
      if (el) {
        document.querySelectorAll('#handPlayer .card').forEach((node) => node.classList.remove('selected'));
        el.classList.add('selected');
      }

      if (state.mode === 'solo') {
        state.enemySelected = chooseAiCard();
        logMessage(`你出牌：${card}，電腦出牌：${state.enemySelected}`);
        setStatus('已出牌，結果確認中');
        renderHands();
        setTimeout(resolveSoloRound, 500);
        return;
      }

      if (!state.conn || !state.conn.open) {
        setStatus('連線尚未建立');
        return;
      }

      const payload = { type: 'play', card };
      state.conn.send(payload);
      logMessage(`你出牌：${card}`);
      setStatus('已出牌，等待對手');
      renderHands();
    }

    function endGame() {
      if (state.score.emperor > state.score.slave) {
        setStatus('遊戲結束，皇帝方獲勝');
      } else if (state.score.slave > state.score.emperor) {
        setStatus('遊戲結束，奴隸方獲勝');
      } else {
        setStatus('遊戲結束，雙方平手');
      }
      resultEl.textContent = '遊戲結束';
      logMessage('遊戲結束');
      state.gameStarted = false;
      state.roundLock = true;
    }

    function resetLocalState() {
      state.myDeck = [];
      state.enemyDeck = [];
      state.mySelected = null;
      state.enemySelected = null;
      state.gameStarted = false;
      state.roundLock = false;
      state.score = { emperor: 0, slave: 0 };
      updateScore();
      handPlayer.innerHTML = '';
      handEnemy.innerHTML = '';
    }

    function detachPeer() {
      if (state.conn) {
        try { state.conn.close(); } catch (error) {}
        state.conn = null;
      }
      if (state.peer) {
        try { state.peer.destroy(); } catch (error) {}
        state.peer = null;
      }
      state.isHost = false;
      state.roomId = '';
      roomInput.value = '';
      setConnStatus('尚未連線');
    }

    function setMode(mode) {
      state.mode = mode;
      document.getElementById('modeSolo').classList.toggle('active', mode === 'solo');
      document.getElementById('modeMulti').classList.toggle('active', mode === 'multi');
      document.getElementById('soloBar').classList.toggle('hidden-solo', mode !== 'solo');
      document.getElementById('multiBar').classList.toggle('hidden-multi', mode !== 'multi');

      detachPeer();

      if (mode === 'solo') {
        setStatus('選擇角色後開始遊戲');
        resultEl.textContent = '等待開始';
        resetLocalState();
        updateRoleLabel();
      } else {
        setStatus('請建立或加入房間');
        resultEl.textContent = '等待對戰開始';
        resetLocalState();
        updateRoleLabel();
      }
    }

    function startMultiGame() {
      state.mode = 'multi';
      state.myDeck = createDeck();
      state.enemyDeck = createDeck();
      state.mySelected = null;
      state.enemySelected = null;
      state.gameStarted = true;
      state.roundLock = false;
      state.score = { emperor: 0, slave: 0 };
      updateRoleLabel();
      updateScore();
      setStatus('連線成功，請出牌');
      resultEl.textContent = '輪到你出牌';
      logMessage('多人模式開始');
      renderHands();
    }

    function handleIncomingMove(data) {
      state.enemySelected = data.card;
      const myCard = state.mySelected;
      if (!myCard) {
        setStatus('對手已出牌，請出牌');
        renderHands();
        return;
      }

      const emperorCard = state.playerRole === 'emperor' ? myCard : data.card;
      const slaveCard = state.playerRole === 'emperor' ? data.card : myCard;
      const winner = battleWinner(emperorCard, slaveCard);

      if (winner === 'emperor') state.score.emperor += 1;
      else if (winner === 'slave') state.score.slave += 1;
      updateScore();

      removeCard(state.myDeck, myCard);
      removeCard(state.enemyDeck, data.card);

      if (state.playerRole === 'emperor') {
        if (winner === 'emperor') resultEl.textContent = '你獲勝！';
        else if (winner === 'slave') resultEl.textContent = '你落敗！';
        else resultEl.textContent = '這回合平手';
      } else {
        if (winner === 'slave') resultEl.textContent = '你獲勝！';
        else if (winner === 'emperor') resultEl.textContent = '你落敗！';
        else resultEl.textContent = '這回合平手';
      }

      logMessage(`本回合：你出 ${myCard}，對手出 ${data.card}，結果：${winner === 'tie' ? '平手' : winner === 'emperor' ? '皇帝方勝' : '奴隸方勝'}`);
      renderHands();

      if (state.myDeck.length === 0 || state.enemyDeck.length === 0) {
        setTimeout(endGame, 600);
        return;
      }

      setTimeout(() => {
        state.mySelected = null;
        state.enemySelected = null;
        state.roundLock = false;
        setStatus('請出牌');
        resultEl.textContent = '輪到你出牌';
        renderHands();
      }, 900);
    }

    function bindConnection(connection) {
      state.conn = connection;
      state.conn.on('open', () => {
        setConnStatus('已連線');
        setStatus('連線成功，請出牌');
        startMultiGame();
      });

      state.conn.on('data', (data) => {
        if (data && data.type === 'play') {
          state.enemySelected = data.card;
          logMessage(`對手出牌：${data.card}`);
          renderHands();
          if (state.mySelected) handleIncomingMove(data);
          else setStatus('對手已出牌，請出牌');
        }
      });

      state.conn.on('close', () => {
        setConnStatus('連線中斷');
        setStatus('對手已離線');
        resultEl.textContent = '連線中斷';
        state.conn = null;
      });

      state.conn.on('error', (error) => {
        console.error('Peer connection error:', error);
        setConnStatus('連線錯誤');
        setStatus('連線發生錯誤，請重新嘗試');
      });
    }

    document.getElementById('modeSolo').addEventListener('click', () => setMode('solo'));
    document.getElementById('modeMulti').addEventListener('click', () => setMode('multi'));

    document.getElementById('btnRoleEmperor').addEventListener('click', () => {
      state.playerRole = 'emperor';
      document.getElementById('btnRoleEmperor').classList.add('selected');
      document.getElementById('btnRoleSlave').classList.remove('selected');
      updateRoleLabel();
    });

    document.getElementById('btnRoleSlave').addEventListener('click', () => {
      state.playerRole = 'slave';
      document.getElementById('btnRoleSlave').classList.add('selected');
      document.getElementById('btnRoleEmperor').classList.remove('selected');
      updateRoleLabel();
    });

    document.getElementById('btnStartSolo').addEventListener('click', () => startSoloGame());

    document.getElementById('btnCreateRoom').addEventListener('click', () => {
      const roomCode = generateRoomCode();
      if (state.peer) {
        try { state.peer.destroy(); } catch (error) {}
      }

      state.peer = new Peer(roomCode);
      state.isHost = true;
      state.playerRole = 'emperor';
      state.roomId = roomCode;
      roomInput.value = roomCode;
      updateRoleLabel();

      state.peer.on('open', () => {
        state.roomId = roomCode;
        roomInput.value = roomCode;
        setConnStatus(`房間碼：${roomCode}`);
        setStatus('等待對手加入...');
        logMessage(`房間建立成功：${roomCode}`);
      });

      state.peer.on('connection', (connection) => {
        state.isHost = true;
        bindConnection(connection);
      });

      state.peer.on('error', (error) => {
        console.error('Peer host error:', error);
        setConnStatus('房間失敗');
        setStatus('房間建立失敗，請稍後再試');
      });
    });

    document.getElementById('btnJoinRoom').addEventListener('click', () => {
      const roomId = sanitizeRoomCode(roomInput.value.trim());
      if (!/^\d{5}$/.test(roomId)) {
        alert('請輸入 5 位數字房間碼');
        return;
      }

      if (state.peer) {
        try { state.peer.destroy(); } catch (error) {}
      }

      state.peer = new Peer();
      state.isHost = false;
      state.playerRole = 'slave';
      state.roomId = roomId;
      updateRoleLabel();

      state.peer.on('open', () => {
        const connection = state.peer.connect(roomId);
        bindConnection(connection);
        setConnStatus('連線中...');
        setStatus('嘗試連線到房主...');
      });

      state.peer.on('error', (error) => {
        console.error('Peer join error:', error);
        setConnStatus('連線失敗');
        setStatus('無法連線到房間，請確認房間碼');
      });
    });

    document.getElementById('btnCopyRoom').addEventListener('click', async () => {
      const code = sanitizeRoomCode(roomInput.value.trim());
      if (!code) {
        alert('目前沒有房間碼可複製');
        return;
      }
      try {
        await navigator.clipboard.writeText(code);
        setConnStatus('已複製');
        logMessage(`已複製房間碼：${code}`);
      } catch (error) {
        setConnStatus('複製失敗');
        logMessage('複製房間碼失敗，請手動複製');
      }
    });

    roomInput.addEventListener('input', (event) => {
      event.target.value = sanitizeRoomCode(event.target.value);
    });

    updateRoleLabel();
    updateScore();
    setStatus('選擇角色後開始遊戲');
    logMessage('皇帝牌已載入，支援單人與多人模式');
  </script>
</body>
</html>
