<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皇帝牌</title>
  <style>
    :root {
      --bg: #07141c;
      --panel: rgba(16, 35, 46, 0.96);
      --panel-2: rgba(23, 49, 63, 0.96);
      --border: rgba(229, 201, 125, 0.72);
      --gold: #e5c97d;
      --gold-strong: #f8df9a;
      --text: #f5efe5;
      --muted: #d7c9a7;
      --good: #7fe2a1;
      --bad: #f29d9d;
      --warning: #f6c76b;
      --card: #304b5a;
      --card-alt: #1c2e3d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top, rgba(71, 100, 124, 0.32), transparent 40%),
                  linear-gradient(180deg, #07141c 0%, #122935 100%);
      color: var(--text);
      padding: 24px 16px;
    }

    .app {
      width: min(980px, 100%);
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 22px 52px rgba(0, 0, 0, 0.28);
      padding: 20px 16px 18px;
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      letter-spacing: 0.08em;
      color: var(--gold-strong);
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(180deg, #21465a, #142f3d);
      color: var(--text);
      padding: 10px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button.selected {
      border-color: rgba(248, 223, 154, 0.8);
      box-shadow: 0 0 0 2px rgba(248, 223, 154, 0.18);
    }

    .panel {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(229, 201, 125, 0.38);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 12px 0;
    }

    #status, #score {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      color: var(--muted);
    }

    #score {
      color: var(--gold-strong);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .player-box {
      background: var(--panel-2);
      border: 1px solid rgba(229, 201, 125, 0.42);
      border-radius: 14px;
      padding: 14px 12px 12px;
      min-height: 240px;
    }

    .player-box h2 {
      margin: 0 0 14px;
      text-align: center;
      color: var(--gold-strong);
      font-size: 1.12rem;
    }

    .hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 130px;
    }

    .card {
      width: 82px;
      height: 118px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card-alt));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      user-select: none;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      padding: 8px;
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(0,0,0,0.18);
    }

    .card.hidden {
      background: linear-gradient(180deg, #415d6f, #233647);
      color: #eff4fb;
      font-size: 1.7rem;
      cursor: default;
    }

    .card.selected {
      outline: 3px solid var(--good);
      box-shadow: 0 0 0 4px rgba(127, 226, 161, 0.18);
    }

    .card.disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    #result {
      min-height: 34px;
      text-align: center;
      margin: 12px 0 8px;
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--warning);
    }

    #log {
      min-height: 120px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-line;
      background: rgba(0,0,0,0.12);
      border: 1px solid rgba(229,201,125,0.4);
      border-radius: 8px;
      padding: 12px 14px;
      line-height: 1.7;
      color: var(--muted);
    }

    .rules {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .rule {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(229,201,125,0.3);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-weight: 700;
    }

    .rule .badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 54px;
      height: 54px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card-alt));
      font-size: 0.9rem;
    }

    @media (max-width: 760px) {
      .board { grid-template-columns: 1fr; }
      .toolbar { flex-direction: column; }
      button { width: 100%; }
      .rules { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>皇帝牌</h1>

    <div class="toolbar">
      <button id="btnRoleEmperor" class="selected">我當皇帝</button>
      <button id="btnRoleSlave">我當奴隸</button>
      <button id="btnStart">開始遊戲</button>
      <button id="btnReset">重置</button>
    </div>

    <div id="status" class="panel">選擇角色後開始遊戲</div>
    <div id="score" class="panel">分數：皇帝 0 - 0 奴隸</div>

    <div class="board">
      <div class="player-box">
        <h2 id="labelPlayer">我方</h2>
        <div id="handPlayer" class="hand"></div>
      </div>

      <div class="player-box">
        <h2 id="labelEnemy">對手</h2>
        <div id="handEnemy" class="hand"></div>
      </div>
    </div>

    <div id="result">等待開始</div>

    <div class="panel">
      <div style="font-weight:800; margin-bottom:8px; color:var(--gold-strong);">遊戲規則</div>
      <div class="rules">
        <div class="rule"><div class="badge">皇帝</div>皇帝 勝 奴隸</div>
        <div class="rule"><div class="badge">奴隸</div>奴隸 勝 市民</div>
        <div class="rule"><div class="badge">市民</div>市民 勝 皇帝</div>
      </div>
    </div>

    <div id="log" class="panel"></div>
  </div>

  <script>
    const CARD_BEATS = {
      皇帝: '奴隸',
      奴隸: '市民',
      市民: '皇帝'
    };

    const state = {
      humanRole: 'emperor',
      myDeck: [],
      enemyDeck: [],
      mySelected: null,
      enemySelected: null,
      gameStarted: false,
      roundLock: false,
      score: { emperor: 0, slave: 0 }
    };

    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const resultEl = document.getElementById('result');
    const logEl = document.getElementById('log');
    const handPlayer = document.getElementById('handPlayer');
    const handEnemy = document.getElementById('handEnemy');
    const labelPlayer = document.getElementById('labelPlayer');
    const labelEnemy = document.getElementById('labelEnemy');

    function logMessage(text) {
      logEl.textContent += `${text}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(message) {
      statusEl.textContent = `狀態：${message}`;
    }

    function updateScore() {
      scoreEl.textContent = `分數：皇帝 ${state.score.emperor} - ${state.score.slave} 奴隸`;
    }

    function shuffleDeck(deck) {
      const next = [...deck];
      for (let i = next.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [next[i], next[j]] = [next[j], next[i]];
      }
      return next;
    }

    function createDeck() {
      return shuffleDeck(['皇帝', '奴隸', '市民', '市民']);
    }

    function removeCard(deck, card) {
      const index = deck.indexOf(card);
      if (index >= 0) deck.splice(index, 1);
      return deck;
    }

    function getMyDeck() {
      return state.humanRole === 'emperor' ? state.myDeck : state.enemyDeck;
    }

    function getEnemyDeck() {
      return state.humanRole === 'emperor' ? state.enemyDeck : state.myDeck;
    }

    function updateRoleLabels() {
      if (state.humanRole === 'emperor') {
        labelPlayer.textContent = '我（皇帝方）';
        labelEnemy.textContent = '電腦（奴隸方）';
      } else {
        labelPlayer.textContent = '我（奴隸方）';
        labelEnemy.textContent = '電腦（皇帝方）';
      }
    }

    function renderHands() {
      handPlayer.innerHTML = '';
      handEnemy.innerHTML = '';

      const myDeck = getMyDeck();
      const enemyDeck = getEnemyDeck();

      myDeck.forEach((card) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.textContent = card;
        el.dataset.card = card;
        if (state.mySelected === card) {
          el.classList.add('selected');
        }
        if (!state.gameStarted || state.roundLock || state.mySelected) {
          el.classList.add('disabled');
          el.onclick = null;
        } else {
          el.onclick = () => selectCard(card, el);
        }
        handPlayer.appendChild(el);
      });

      enemyDeck.forEach((card) => {
        const el = document.createElement('div');
        el.className = 'card hidden';
        if (state.enemySelected && card === state.enemySelected) {
          el.classList.remove('hidden');
          el.textContent = card;
        } else {
          el.textContent = '?';
        }
        handEnemy.appendChild(el);
      });
    }

    function startNewGame() {
      state.myDeck = createDeck();
      state.enemyDeck = createDeck();
      state.mySelected = null;
      state.enemySelected = null;
      state.gameStarted = true;
      state.roundLock = false;
      state.score = { emperor: 0, slave: 0 };
      updateScore();
      updateRoleLabels();
      setStatus('遊戲開始，請出牌');
      resultEl.textContent = '輪到你出牌';
      logMessage('新遊戲開始');
      renderHands();
    }

    function chooseEnemyCard() {
      const deck = getEnemyDeck();
      if (!deck.length) return null;
      const order = ['皇帝', '奴隸', '市民'];
      for (const card of order) {
        if (deck.includes(card)) return card;
      }
      return deck[Math.floor(Math.random() * deck.length)];
    }

    function resolveRound(playerCard, enemyCard) {
      if (playerCard === enemyCard) return 'tie';
      return CARD_BEATS[playerCard] === enemyCard ? 'emperor' : 'slave';
    }

    function endGame() {
      if (state.score.emperor > state.score.slave) {
        setStatus('遊戲結束，皇帝方獲勝');
      } else if (state.score.slave > state.score.emperor) {
        setStatus('遊戲結束，奴隸方獲勝');
      } else {
        setStatus('遊戲結束，雙方平手');
      }
      resultEl.textContent = '遊戲結束';
      logMessage('遊戲結束');
      state.gameStarted = false;
      state.roundLock = true;
    }

    function finishRound() {
      if (!state.mySelected || !state.enemySelected) return;

      const currentMyDeck = getMyDeck();
      const currentEnemyDeck = getEnemyDeck();
      const myCard = state.mySelected;
      const enemyCard = state.enemySelected;

      const winner = resolveRound(myCard, enemyCard);
      let winnerText = '平手';
      if (winner === 'emperor') {
        winnerText = '皇帝方勝';
        state.score.emperor += 1;
      } else if (winner === 'slave') {
        winnerText = '奴隸方勝';
        state.score.slave += 1;
      }
      updateScore();

      removeCard(currentMyDeck, myCard);
      removeCard(currentEnemyDeck, enemyCard);

      if (state.humanRole === 'emperor') {
        if (winner === 'emperor') resultEl.textContent = '你獲勝！';
        else if (winner === 'slave') resultEl.textContent = '你落敗！';
        else resultEl.textContent = '這回合平手';
      } else {
        if (winner === 'slave') resultEl.textContent = '你獲勝！';
        else if (winner === 'emperor') resultEl.textContent = '你落敗！';
        else resultEl.textContent = '這回合平手';
      }

      logMessage(`本回合：你出 ${myCard}，電腦出 ${enemyCard}，結果：${winnerText}`);
      renderHands();

      if (currentMyDeck.length === 0 || currentEnemyDeck.length === 0) {
        setTimeout(endGame, 600);
        return;
      }

      setTimeout(() => {
        state.mySelected = null;
        state.enemySelected = null;
        state.roundLock = false;
        setStatus('請出牌');
        resultEl.textContent = '輪到你出牌';
        renderHands();
      }, 900);
    }

    function selectCard(card, el) {
      if (!state.gameStarted || state.roundLock || state.mySelected) return;
      state.mySelected = card;
      state.roundLock = true;
      if (el) {
        document.querySelectorAll('#handPlayer .card').forEach((node) => node.classList.remove('selected'));
        el.classList.add('selected');
      }

      const enemyCard = chooseEnemyCard();
      state.enemySelected = enemyCard;
      logMessage(`你出牌：${card}，電腦出牌：${enemyCard}`);
      setStatus('已出牌，結果確認中');
      renderHands();
      setTimeout(finishRound, 500);
    }

    function setRole(role) {
      state.humanRole = role;
      document.getElementById('btnRoleEmperor').classList.toggle('selected', role === 'emperor');
      document.getElementById('btnRoleSlave').classList.toggle('selected', role === 'slave');
    }

    document.getElementById('btnRoleEmperor').addEventListener('click', () => setRole('emperor'));
    document.getElementById('btnRoleSlave').addEventListener('click', () => setRole('slave'));

    document.getElementById('btnStart').addEventListener('click', () => {
      startNewGame();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      state.gameStarted = false;
      state.roundLock = false;
      state.mySelected = null;
      state.enemySelected = null;
      state.score = { emperor: 0, slave: 0 };
      updateScore();
      setStatus('選擇角色後開始遊戲');
      resultEl.textContent = '等待開始';
      logMessage('已重置遊戲');
      handPlayer.innerHTML = '';
      handEnemy.innerHTML = '';
      updateRoleLabels();
    });

    updateRoleLabels();
    updateScore();
    setStatus('選擇角色後開始遊戲');
    logMessage('皇帝牌已載入，可以開始遊戲');
  </script>
</body>
</html>
