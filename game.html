<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皇帝牌｜線上對戰與單人挑戰</title>
  <style>
    :root {
      --bg: #07141c;
      --panel: rgba(16, 35, 46, 0.96);
      --panel-2: rgba(23, 49, 63, 0.96);
      --border: rgba(229, 201, 125, 0.72);
      --gold: #e5c97d;
      --gold-strong: #f8df9a;
      --text: #f5efe5;
      --muted: #d7c9a7;
      --good: #7fe2a1;
      --bad: #f29d9d;
      --warning: #f6c76b;
      --card: #304b5a;
      --card-alt: #1c2e3d;
      --danger: #7a2f32;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: radial-gradient(circle at top, rgba(71, 100, 124, 0.32), transparent 40%), linear-gradient(180deg, #07141c 0%, #122935 100%);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }

    .app {
      width: min(980px, 100%);
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 22px 52px rgba(0, 0, 0, 0.28);
      padding: 20px 16px 18px;
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      letter-spacing: 0.08em;
      color: var(--gold-strong);
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .mode-box {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .mode-btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(180deg, #264d62, #183549);
      color: var(--text);
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .mode-btn.active {
      background: linear-gradient(180deg, #2e5d75, #1f445a);
      box-shadow: 0 0 0 2px rgba(248, 223, 154, 0.18);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input {
      min-width: 220px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    input::placeholder { color: rgba(255,255,255,0.46); }

    button {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(180deg, #21465a, #142f3d);
      color: var(--text);
      padding: 10px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button.selected {
      border-color: rgba(248, 223, 154, 0.8);
      box-shadow: 0 0 0 2px rgba(248, 223, 154, 0.18);
    }

    button.danger {
      background: linear-gradient(180deg, #672f2f, #42242a);
      border-color: rgba(242, 157, 157, 0.6);
    }

    .panel {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(229, 201, 125, 0.38);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 12px 0;
    }

    #status, #score, #connStatus, #roomMeta {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      color: var(--muted);
    }

    #score {
      color: var(--gold-strong);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .player-box {
      background: var(--panel-2);
      border: 1px solid rgba(229, 201, 125, 0.42);
      border-radius: 14px;
      padding: 14px 12px 12px;
      min-height: 240px;
    }

    .player-box h2 {
      margin: 0 0 14px;
      text-align: center;
      color: var(--gold-strong);
      font-size: 1.12rem;
    }

    .hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 130px;
    }

    .card {
      width: 82px;
      height: 118px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card-alt));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      user-select: none;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      padding: 8px;
      color: var(--text);
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(0,0,0,0.18);
    }

    .card.hidden {
      background: linear-gradient(180deg, #415d6f, #233647);
      color: #eff4fb;
      font-size: 1.7rem;
      cursor: default;
    }

    .card.selected {
      outline: 3px solid var(--good);
      box-shadow: 0 0 0 4px rgba(127, 226, 161, 0.18);
    }

    .card.disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    #result {
      min-height: 34px;
      text-align: center;
      margin: 12px 0 8px;
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--warning);
    }

    #log {
      min-height: 120px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-line;
      background: rgba(0,0,0,0.12);
      border: 1px solid rgba(229,201,125,0.4);
      border-radius: 8px;
      padding: 12px 14px;
      line-height: 1.7;
      color: var(--muted);
    }

    .rules {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .rule {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(229,201,125,0.3);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-weight: 700;
    }

    .rule .badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 54px;
      height: 54px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card-alt));
      font-size: 0.9rem;
    }

    .hidden-multi, .hidden-solo {
      display: none;
    }

    @media (max-width: 760px) {
      #board { grid-template-columns: 1fr; }
      .toolbar, .mode-box { flex-direction: column; }
      button, input { width: 100%; }
      .rules { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>皇帝牌</h1>

    <div class="mode-box">
      <button id="modeSolo" class="mode-btn active" type="button">單人模式</button>
      <button id="modeMulti" class="mode-btn" type="button">多人模式</button>
    </div>

    <div id="soloBar" class="toolbar">
      <button id="btnRoleEmperor" class="selected" type="button">我當皇帝</button>
      <button id="btnRoleSlave" type="button">我當奴隸</button>
      <button id="btnStartSolo" type="button">開始單人遊戲</button>
    </div>

    <div id="multiBar" class="toolbar hidden-multi">
      <input id="playerNameInput" type="text" placeholder="你的暱稱" maxlength="12" />
      <button id="btnCreateRoom" type="button">建立房間</button>
      <input id="roomInput" type="text" placeholder="輸入 5 位數房間碼" maxlength="5" inputmode="numeric" />
      <button id="btnJoinRoom" type="button">加入房間</button>
      <button id="btnStartMulti" type="button">開始對戰</button>
      <button id="btnLeaveRoom" class="danger" type="button">離開房間</button>
      <button id="btnCopyRoom" type="button">複製碼</button>
      <span id="connStatus">尚未連線</span>
    </div>

    <div id="roomMeta" class="panel">房間：尚未建立</div>
    <div id="status" class="panel">選擇角色後開始遊戲</div>
    <div id="score" class="panel">分數：皇帝 0 - 0 奴隸</div>

    <div id="board">
      <div class="player-box">
        <h2 id="labelPlayer">我方</h2>
        <div id="handPlayer" class="hand"></div>
      </div>

      <div class="player-box">
        <h2 id="labelEnemy">對手</h2>
        <div id="handEnemy" class="hand"></div>
      </div>
    </div>

    <div id="result">等待開始</div>

    <div class="panel">
      <div style="font-weight:800; margin-bottom:8px; color:var(--gold-strong);">遊戲規則</div>
      <div class="rules">
        <div class="rule"><div class="badge">皇帝</div>皇帝 勝 奴隸</div>
        <div class="rule"><div class="badge">奴隸</div>奴隸 勝 市民</div>
        <div class="rule"><div class="badge">市民</div>市民 勝 皇帝</div>
      </div>
    </div>

    <div id="log" class="panel"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const CARD_LABEL = {
      EMPEROR: '皇帝',
      CITIZEN: '市民',
      SLAVE: '奴隸'
    };

    const CARD_BEATS = {
      EMPEROR: 'SLAVE',
      SLAVE: 'CITIZEN',
      CITIZEN: 'EMPEROR'
    };

    const roleLabelMap = {
      EMPEROR: '皇帝方',
      SLAVE: '奴隸方',
      CITIZEN: '市民方'
    };

    const state = {
      mode: 'solo',
      socket: null,
      roomId: '',
      roomState: null,
      myPlayerIndex: null,
      selectedMultiCardId: null,
      solo: {
        playerRole: 'emperor',
        myDeck: [],
        enemyDeck: [],
        mySelected: null,
        enemySelected: null,
        gameStarted: false,
        roundLock: false,
        score: { emperor: 0, slave: 0 }
      }
    };

    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const resultEl = document.getElementById('result');
    const logEl = document.getElementById('log');
    const handPlayer = document.getElementById('handPlayer');
    const handEnemy = document.getElementById('handEnemy');
    const labelPlayer = document.getElementById('labelPlayer');
    const labelEnemy = document.getElementById('labelEnemy');
    const roomInput = document.getElementById('roomInput');
    const playerNameInput = document.getElementById('playerNameInput');
    const connStatusEl = document.getElementById('connStatus');
    const roomMetaEl = document.getElementById('roomMeta');

    function logMessage(text) {
      logEl.textContent += `${text}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(message) {
      statusEl.textContent = `狀態：${message}`;
    }

    function setConnStatus(text) {
      connStatusEl.textContent = text;
    }

    function setRoomMeta(text) {
      roomMetaEl.textContent = text;
    }

    function sanitizeRoomCode(value) {
      return String(value || '').replace(/[^A-Z0-9]/gi, '').slice(0, 5).toUpperCase();
    }

    function updateScore() {
      scoreEl.textContent = `分數：皇帝 ${state.solo.score.emperor} - ${state.solo.score.slave} 奴隸`;
    }

    function shuffleDeck(deck) {
      const next = [...deck];
      for (let i = next.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [next[i], next[j]] = [next[j], next[i]];
      }
      return next;
    }

    function createSoloDeck() {
      return shuffleDeck(['皇帝', '奴隸', '市民', '市民']);
    }

    function removeCard(deck, card) {
      const index = deck.indexOf(card);
      if (index >= 0) deck.splice(index, 1);
      return deck;
    }

    function getPlayerName() {
      const value = (playerNameInput.value || '').trim();
      return value || '玩家';
    }

    function updateRoleLabel() {
      if (state.mode === 'solo') {
        if (state.solo.playerRole === 'emperor') {
          labelPlayer.textContent = '我（皇帝方）';
          labelEnemy.textContent = '電腦（奴隸方）';
        } else {
          labelPlayer.textContent = '我（奴隸方）';
          labelEnemy.textContent = '電腦（皇帝方）';
        }
        return;
      }

      if (!state.roomState || state.myPlayerIndex === null) {
        labelPlayer.textContent = '我方';
        labelEnemy.textContent = '對手';
        return;
      }

      const myPlayer = state.roomState.players[state.myPlayerIndex];
      const opponent = state.roomState.players.find((player, index) => index !== state.myPlayerIndex) || null;

      const myRole = myPlayer?.role || '';
      const oppRole = opponent?.role || '';
      labelPlayer.textContent = myRole ? `${myPlayer.name}（${roleLabelMap[myRole] || myRole}）` : myPlayer?.name || '我方';
      labelEnemy.textContent = oppRole ? `${opponent.name}（${roleLabelMap[oppRole] || oppRole}）` : opponent?.name || '對手';
    }

    function renderSoloHands() {
      handPlayer.innerHTML = '';
      handEnemy.innerHTML = '';

      const myDeck = state.solo.myDeck;
      const enemyDeck = state.solo.enemyDeck;
      const shouldRevealEnemy = Boolean(state.solo.enemySelected && state.solo.mySelected);

      myDeck.forEach((card) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.textContent = card;
        el.dataset.card = card;
        if (state.solo.mySelected === card) {
          el.classList.add('selected');
        }
        if (!state.solo.gameStarted || state.solo.roundLock || state.solo.mySelected) {
          el.classList.add('disabled');
          el.onclick = null;
        } else {
          el.onclick = () => selectSoloCard(card, el);
        }
        handPlayer.appendChild(el);
      });

      enemyDeck.forEach((card) => {
        const el = document.createElement('div');
        el.className = 'card hidden';
        if (shouldRevealEnemy && card === state.solo.enemySelected) {
          el.classList.remove('hidden');
          el.textContent = card;
        } else {
          el.textContent = '?';
        }
        handEnemy.appendChild(el);
      });
    }

    function renderMultiHands() {
      handPlayer.innerHTML = '';
      handEnemy.innerHTML = '';

      if (!state.roomState || state.myPlayerIndex === null) {
        handPlayer.innerHTML = '';
        handEnemy.innerHTML = '';
        return;
      }

      const myPlayer = state.roomState.players[state.myPlayerIndex];
      const opponent = state.roomState.players.find((player, index) => index !== state.myPlayerIndex) || null;

      if (myPlayer && myPlayer.hand) {
        myPlayer.hand.forEach((card) => {
          const isMyTurn = state.roomState.turnIndex === state.myPlayerIndex && state.roomState.phase === 'playing';
          const selected = state.selectedMultiCardId === card.id;
          const el = document.createElement('div');
          el.className = 'card';
          el.textContent = CARD_LABEL[card.type] || card.type;
          el.dataset.cardId = card.id;
          if (selected) el.classList.add('selected');
          if (!isMyTurn || state.selectedMultiCardId) {
            el.classList.add('disabled');
            el.onclick = null;
          } else {
            el.onclick = () => handleLocalMultiCardClick(card);
          }
          handPlayer.appendChild(el);
        });
      }

      if (!opponent) {
        const placeholder = document.createElement('div');
        placeholder.className = 'card hidden';
        placeholder.textContent = '?';
        handEnemy.appendChild(placeholder);
        return;
      }

      const opponentCards = Array.from({ length: Math.max(opponent.handCount || 0, 0) }, (_, index) => index);
      opponentCards.forEach(() => {
        const el = document.createElement('div');
        el.className = 'card hidden';
        el.textContent = '?';
        handEnemy.appendChild(el);
      });

      if (state.roomState.phase !== 'playing') {
        handEnemy.innerHTML = '';
        const waiting = document.createElement('div');
        waiting.className = 'card hidden';
        waiting.textContent = '待';
        handEnemy.appendChild(waiting);
      }
    }

    function render() {
      if (state.mode === 'solo') {
        renderSoloHands();
        updateRoleLabel();
        return;
      }

      renderMultiHands();
      updateRoleLabel();

      if (!state.roomState) {
        setRoomMeta('房間：尚未建立');
        return;
      }

      const ownerName = state.roomState.players.find((p) => p.id === state.roomState.ownerId)?.name || '房主';
      const myPlayer = state.roomState.players[state.myPlayerIndex];
      setRoomMeta(`房間：${state.roomId || '未知'}｜房主：${ownerName}｜${myPlayer ? myPlayer.name : '我'}｜狀態：${state.roomState.status}`);
    }

    function startSoloGame() {
      state.mode = 'solo';
      state.solo.playerRole = document.getElementById('btnRoleEmperor').classList.contains('selected') ? 'emperor' : 'slave';
      state.solo.myDeck = createSoloDeck();
      state.solo.enemyDeck = createSoloDeck();
      state.solo.mySelected = null;
      state.solo.enemySelected = null;
      state.solo.gameStarted = true;
      state.solo.roundLock = false;
      state.solo.score = { emperor: 0, slave: 0 };
      updateScore();
      setStatus('遊戲開始，請出牌');
      resultEl.textContent = '輪到你出牌';
      logMessage('單人模式開始');
      render();
    }

    function chooseAiCard() {
      const deck = state.solo.enemyDeck;
      if (!deck.length) return null;
      const order = ['皇帝', '奴隸', '市民'];
      for (const card of order) {
        if (deck.includes(card)) return card;
      }
      return deck[Math.floor(Math.random() * deck.length)];
    }

    function battleWinner(emperorCard, slaveCard) {
      if (emperorCard === slaveCard) return 'tie';
      return CARD_BEATS[emperorCard] === slaveCard ? 'emperor' : 'slave';
    }

    function resolveSoloRound() {
      if (!state.solo.mySelected || !state.solo.enemySelected) return;

      const myCard = state.solo.mySelected;
      const enemyCard = state.solo.enemySelected;
      const emperorCard = state.solo.playerRole === 'emperor' ? myCard : enemyCard;
      const slaveCard = state.solo.playerRole === 'emperor' ? enemyCard : myCard;
      const result = battleWinner(emperorCard, slaveCard);

      if (result === 'emperor') state.solo.score.emperor += 1;
      else if (result === 'slave') state.solo.score.slave += 1;
      updateScore();

      removeCard(state.solo.myDeck, myCard);
      removeCard(state.solo.enemyDeck, enemyCard);

      if (state.solo.playerRole === 'emperor') {
        if (result === 'emperor') resultEl.textContent = '你獲勝！';
        else if (result === 'slave') resultEl.textContent = '你落敗！';
        else resultEl.textContent = '這回合平手';
      } else {
        if (result === 'slave') resultEl.textContent = '你獲勝！';
        else if (result === 'emperor') resultEl.textContent = '你落敗！';
        else resultEl.textContent = '這回合平手';
      }

      logMessage(`本回合：你出 ${myCard}，電腦出 ${enemyCard}，結果：${result === 'tie' ? '平手' : result === 'emperor' ? '皇帝方勝' : '奴隸方勝'}`);
      render();

      if (state.solo.myDeck.length === 0 || state.solo.enemyDeck.length === 0) {
        setTimeout(endSoloGame, 600);
        return;
      }

      setTimeout(() => {
        state.solo.mySelected = null;
        state.solo.enemySelected = null;
        state.solo.roundLock = false;
        setStatus('請出牌');
        resultEl.textContent = '輪到你出牌';
        render();
      }, 900);
    }

    function selectSoloCard(card, el) {
      if (!state.solo.gameStarted || state.solo.roundLock || state.solo.mySelected) return;

      state.solo.mySelected = card;
      state.solo.roundLock = true;

      if (el) {
        document.querySelectorAll('#handPlayer .card').forEach((node) => node.classList.remove('selected'));
        el.classList.add('selected');
      }

      state.solo.enemySelected = chooseAiCard();
      logMessage(`你出牌：${card}，電腦出牌：${state.solo.enemySelected}`);
      setStatus('已出牌，結果確認中');
      render();
      setTimeout(resolveSoloRound, 500);
    }

    function endSoloGame() {
      if (state.solo.score.emperor > state.solo.score.slave) {
        setStatus('遊戲結束，皇帝方獲勝');
      } else if (state.solo.score.slave > state.solo.score.emperor) {
        setStatus('遊戲結束，奴隸方獲勝');
      } else {
        setStatus('遊戲結束，雙方平手');
      }
      resultEl.textContent = '遊戲結束';
      logMessage('單人遊戲結束');
      state.solo.gameStarted = false;
      state.solo.roundLock = true;
    }

    function resetSoloState() {
      state.solo.myDeck = [];
      state.solo.enemyDeck = [];
      state.solo.mySelected = null;
      state.solo.enemySelected = null;
      state.solo.gameStarted = false;
      state.solo.roundLock = false;
      state.solo.score = { emperor: 0, slave: 0 };
      updateScore();
      handPlayer.innerHTML = '';
      handEnemy.innerHTML = '';
    }

    function setMode(mode) {
      state.mode = mode;
      document.getElementById('modeSolo').classList.toggle('active', mode === 'solo');
      document.getElementById('modeMulti').classList.toggle('active', mode === 'multi');
      document.getElementById('soloBar').classList.toggle('hidden-solo', mode !== 'solo');
      document.getElementById('multiBar').classList.toggle('hidden-multi', mode !== 'multi');

      if (mode === 'solo') {
        setStatus('選擇角色後開始遊戲');
        resultEl.textContent = '等待開始';
        resetSoloState();
        updateRoleLabel();
        render();
      } else {
        setStatus('請建立或加入房間');
        resultEl.textContent = '等待對戰開始';
        resetSoloState();
        updateRoleLabel();
        render();
      }
    }

    function connectSocket() {
      if (state.socket) return;
      state.socket = io();

      state.socket.on('connect', () => {
        setConnStatus('已連線');
        logMessage('連線成功');
      });

      state.socket.on('disconnect', () => {
        setConnStatus('連線中斷');
        logMessage('伺服器連線中斷');
      });

      state.socket.on('room:joined', ({ roomId, isOwner, state: roomState }) => {
        state.roomId = roomId;
        state.roomState = roomState;
        state.myPlayerIndex = roomState?.myPlayerIndex ?? null;
        state.selectedMultiCardId = null;
        setConnStatus(`已加入房間 ${roomId}`);
        setStatus(isOwner ? '房間建立成功，等待對手加入' : '已加入房間，等待房主開始');
        resultEl.textContent = isOwner ? '等待對手加入' : '等待房主開始';
        logMessage(`已進入房間：${roomId}`);
        render();
      });

      state.socket.on('room:state', (roomState) => {
        state.roomState = roomState;
        state.myPlayerIndex = roomState?.myPlayerIndex ?? null;
        state.roomId = roomState?.id || state.roomId;
        state.selectedMultiCardId = null;
        setStatus(roomState?.status || '等待狀態');
        resultEl.textContent = roomState?.winner ? `勝者：${roomState.winner}` : (roomState?.phase === 'playing' ? `輪到 ${roomState.players[roomState.turnIndex]?.name || '對手'} 出牌` : '等待對戰開始');
        render();
      });

      state.socket.on('room:player-joined', ({ name }) => {
        logMessage(`${name} 加入房間`);
      });

      state.socket.on('room:error', (message) => {
        alert(message);
        logMessage(`錯誤：${message}`);
      });
    }

    function createRoom() {
      connectSocket();
      const myName = getPlayerName();
      state.socket.emit('room:create', { name: myName });
      setStatus('建立房間中...');
      logMessage('正在建立房間...');
    }

    function joinRoom() {
      connectSocket();
      const roomId = sanitizeRoomCode(roomInput.value);
      if (!/^[A-Z0-9]{5}$/.test(roomId)) {
        alert('請輸入 5 位數房間碼');
        return;
      }
      const myName = getPlayerName();
      state.socket.emit('room:join', { roomId, name: myName });
      setStatus('加入房間中...');
      logMessage(`正在加入房間：${roomId}`);
    }

    function startMultiGame() {
      connectSocket();
      if (!state.roomId) {
        alert('請先建立或加入房間');
        return;
      }
      state.socket.emit('room:start', { roomId: state.roomId });
      logMessage(`開始對戰：${state.roomId}`);
    }

    function leaveRoom() {
      if (!state.socket || !state.roomId) return;
      state.socket.emit('room:leave', { roomId: state.roomId });
      state.roomState = null;
      state.roomId = '';
      state.myPlayerIndex = null;
      state.selectedMultiCardId = null;
      roomInput.value = '';
      setRoomMeta('房間：尚未建立');
      setConnStatus('尚未連線');
      setStatus('已離開房間');
      resultEl.textContent = '等待開始';
      logMessage('已離開房間');
      render();
    }

    function handleLocalMultiCardClick(card) {
      if (!state.roomState || state.myPlayerIndex === null) return;
      if (state.roomState.phase !== 'playing') return;
      if (state.roomState.turnIndex !== state.myPlayerIndex) {
        setStatus('現在不是你的回合');
        return;
      }
      state.selectedMultiCardId = card.id;
      state.socket.emit('game:playCard', { roomId: state.roomId, cardId: card.id });
      setStatus('已出牌，等待對手');
      render();
    }

    document.getElementById('modeSolo').addEventListener('click', () => setMode('solo'));
    document.getElementById('modeMulti').addEventListener('click', () => setMode('multi'));

    document.getElementById('btnRoleEmperor').addEventListener('click', () => {
      state.solo.playerRole = 'emperor';
      document.getElementById('btnRoleEmperor').classList.add('selected');
      document.getElementById('btnRoleSlave').classList.remove('selected');
      updateRoleLabel();
    });

    document.getElementById('btnRoleSlave').addEventListener('click', () => {
      state.solo.playerRole = 'slave';
      document.getElementById('btnRoleSlave').classList.add('selected');
      document.getElementById('btnRoleEmperor').classList.remove('selected');
      updateRoleLabel();
    });

    document.getElementById('btnStartSolo').addEventListener('click', startSoloGame);
    document.getElementById('btnCreateRoom').addEventListener('click', createRoom);
    document.getElementById('btnJoinRoom').addEventListener('click', joinRoom);
    document.getElementById('btnStartMulti').addEventListener('click', startMultiGame);
    document.getElementById('btnLeaveRoom').addEventListener('click', leaveRoom);

    document.getElementById('btnCopyRoom').addEventListener('click', async () => {
      const code = sanitizeRoomCode(roomInput.value || state.roomId || '');
      if (!code) {
        alert('目前沒有房間碼可複製');
        return;
      }
      try {
        await navigator.clipboard.writeText(code);
        setConnStatus('已複製');
        logMessage(`已複製房間碼：${code}`);
      } catch (error) {
        setConnStatus('複製失敗');
        logMessage('複製房間碼失敗，請手動複製');
      }
    });

    roomInput.addEventListener('input', (event) => {
      event.target.value = sanitizeRoomCode(event.target.value);
    });

    playerNameInput.value = '玩家';
    updateScore();
    updateRoleLabel();
    setStatus('選擇角色後開始遊戲');
    logMessage('皇帝牌已載入，支援單人與多人模式');
    render();
  </script>
</body>
</html>
